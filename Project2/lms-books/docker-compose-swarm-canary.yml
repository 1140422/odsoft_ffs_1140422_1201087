version: "3.9"

services:
  # Canary services (blue/green)
  lmsbooks_blue:
    image: lmsbooks:blue
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap
      - spring.datasource.url=jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/postgres
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      - file.upload-dir=/tmp/uploads-psoft-g1-blue
      - spring.rabbitmq.host=rabbitmq
    volumes:
      - "uploaded_files_volume_1:/tmp"
    deploy:
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.lmsbooks_blue.loadbalancer.server.port=8080"
    networks:
      - lms_network
      - lms_overlay_attachable_network

  lmsbooks_green:
    image: lmsbooks:green
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap
      - spring.datasource.url=jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/postgres
      - spring.datasource.username=postgres
      - spring.datasource.password=password
      - file.upload-dir=/tmp/uploads-psoft-g1-green
      - spring.rabbitmq.host=rabbitmq
    volumes:
      - "uploaded_files_volume_2:/tmp"
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.lmsbooks_green.loadbalancer.server.port=8080"
    networks:
      - lms_network
      - lms_overlay_attachable_network

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    deploy:
      replicas: 2
    ports:
      - "5432-5450:5432"
    networks:
      - lms_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    deploy:
      replicas: 1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - lms_network

networks:
  lms_network:
    driver: overlay

  # network externa (a do Traefik)
  lms_overlay_attachable_network:
    external: true

volumes:
  uploaded_files_volume_1:
  uploaded_files_volume_2: